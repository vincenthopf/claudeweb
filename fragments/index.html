<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAGMENTS - A Meditation on Digital Attention</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="intro" class="overlay">
        <div class="content">
            <h1>FRAGMENTS</h1>
            <p class="subtitle">A meditation on digital attention</p>
            <div class="instructions">
                <p>Every click fragments your focus.</p>
                <p>Every movement disturbs your peace.</p>
                <p>But if you sit still...</p>
                <p>Something emerges from the chaos.</p>
            </div>
            <button id="enter">ENTER</button>
        </div>
    </div>

    <div id="stillness-indicator">
        <div id="stillness-bar"></div>
        <span id="stillness-text">stillness</span>
    </div>

    <div id="message"></div>

    <script src="fragments.js"></script>
</body>
</html>
