<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traces — A Digital Ephemera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="overlay">
        <h1 class="title">Traces</h1>
        <p class="instruction">Move to leave your mark. Watch it fade.</p>
    </div>

    <div class="info">
        <p>Every trace you leave will slowly disappear.</p>
        <p>Nothing here is permanent. Everything is fleeting.</p>
        <p class="meta">A meditation on digital impermanence</p>
    </div>

    <script src="traces.js"></script>
</body>
</html>
